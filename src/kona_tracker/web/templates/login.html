{% extends "base.html" %}
{% block title %}Kona · passcode{% endblock %}
{% block body %}
<section class="login">
  <div class="avatar" aria-hidden="true">K<img src="/static/kona.jpg" alt="" data-optional></div>
  <h1>Kona<br>Tracker</h1>
  <p>Private. Two people. One dog.</p>
  <form method="post" action="/login" autocomplete="off">
    <label for="passcode" class="cap">Passcode</label>
    <input id="passcode" name="passcode" type="password" inputmode="numeric"
           autocomplete="one-time-code" autofocus required>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <button type="submit">Enter</button>
    <div class="fine">Stays signed in on this phone for 30 days</div>
  </form>
</section>
{% endblock %}
