{% macro hourly_chart(data, metric) %}
<a class="hourly-preview" href="/preview/{{ metric }}" aria-label="Open sample {{ metric }} history">
  <span class="hourly-heading"><strong>{{ 'Steps' if metric == 'steps' else 'Rest' }} by hour</strong><span>Through 11:00 <span aria-hidden="true">↗</span></span></span>
  <svg class="bar-chart" viewBox="0 0 340 174" preserveAspectRatio="none" role="img" aria-label="Sample hourly {{ metric }}. Open for readings and details.">
    <path class="chart-rule" d="M0 162H340"/>
    {% for b in data.buckets %}
    {% if b.value is none %}<path class="future-bar" d="M{{ b.x }} 162h{{ b.width }}"/>
    {% elif b.value == 0 %}<circle class="zero-bar" cx="{{ b.x + b.width / 2 }}" cy="162" r="2"/>
    {% elif metric == 'steps' %}<rect class="step-bar" x="{{ b.x }}" y="{{ 162 - b.height }}" width="{{ b.width }}" height="{{ b.height }}" rx="2"/>
    {% else %}<rect class="sleep-bar" x="{{ b.x }}" y="{{ 162 - b.sleep_height }}" width="{{ b.width }}" height="{{ b.sleep_height }}" rx="2"/><rect class="nap-bar" x="{{ b.x }}" y="{{ 162 - b.height }}" width="{{ b.width }}" height="{{ b.nap_height }}" rx="2"/>{% endif %}
    {% endfor %}
  </svg>
  <span class="chart-axis"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span></span>
  {% if metric == 'rest' %}<span class="spark-key"><span><i class="sleep-key"></i>Sleep</span><span><i class="nap-key"></i>Naps</span></span>{% endif %}
</a>
{% endmacro %}
