<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0f10">
  <title>{% block title %}Kona{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="page">{% block body %}{% endblock %}</main>
  {% if tab %}
  <nav class="tabs" aria-label="Sections">
    <a href="/activity" class="{{ 'on' if tab == 'activity' else '' }}">Activity</a>
    <a href="/camera" class="{{ 'on' if tab == 'camera' else '' }}">Camera</a>
  </nav>
  {% endif %}
</body>
</html>
