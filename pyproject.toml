[project]
name = "kona-tracker"
version = "0.1.0"
description = "Private, passcode-gated web app to check on Kona (Fi collar data, camera later)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.27",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "opencv-python-headless>=5.0.0.93",
    "pytapo>=3.4.19",
    "python-multipart>=0.0.32",
    "typer>=0.12",
    "tzdata>=2026.3",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
kona = "kona_tracker.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kona_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
