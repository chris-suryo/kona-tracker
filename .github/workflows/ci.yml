name: ci

on:
  push:
  pull_request:

# Read-only by default. This workflow only runs tests; nothing here needs to
# write to the repo, and a token that cannot write is a token that cannot be
# turned against it.
permissions:
  contents: read

# A push to a branch with an open PR triggers this twice. Cancel the older
# run: a result for a commit that has already been replaced is four cells of
# runner time spent answering a question nobody is asking any more. Never
# cancel on main, where each run is the record for that commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The floor pyproject declares, and the version the PC runs. A floor
        # nobody tests is a claim, not a fact -- and so is a ceiling. 3.14 is
        # here because Application Control forced the PC onto the only signed
        # interpreter it has, which is 3.14.6 (docs/history/2026-09-30-
        # application-control-blocks-python.md). Before that it was untested,
        # which made the machine that serves this app the place 3.14 bugs would
        # surface first.
        python: ["3.11", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
