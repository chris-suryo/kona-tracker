name: ci

on:
  push:
  pull_request:

# Read-only by default. This workflow only runs tests; nothing here needs to
# write to the repo, and a token that cannot write is a token that cannot be
# turned against it.
permissions:
  contents: read

# A push to a branch with an open PR triggers this twice. Cancel the older
# run: a result for a commit that has already been replaced is four cells of
# runner time spent answering a question nobody is asking any more. Never
# cancel on main, where each run is the record for that commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The floor pyproject declares and the version the PC runs. A floor
        # nobody tests is a claim, not a fact.
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
